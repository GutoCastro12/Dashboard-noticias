name: Occurrence Auditor V2 — development pilot

# Segunda rodada do benchmark de DESENVOLVIMENTO do auditor de novidade.
#
# A V1 mediu duas coisas ao mesmo tempo: capacidade semântica e dois defeitos do
# próprio experimento (a string "null" devolvida pelo provider, e um exemplo
# congelado que o próprio parser recusava). A V2 corrige só isso, para que o
# número seja interpretável.
#
# Workflow SEPARADO do da V1, não uma edição dele. Editar o da V1 apagaria o
# arranjo que produziu os resultados de `6246324`, e é contra eles que a V2 será
# comparada.
#
# Não commita nada. Não toca `risk_history.json`, `index.html`, verdade humana
# nem `config_risco.yaml`. `contents: read` torna isso restrição, não intenção.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Duas execuções simultâneas produziriam dois "primeiros resultados" para o
  # mesmo par modelo×alvo, e o primeiro resultado é o único que vale.
  group: occurrence-auditor-v2-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # `google-generativeai` está COMENTADO no requirements.txt; o cron
      # principal o instala na linha de comando. Instalar só o requirements
      # deixa o SDK de fora e a execução morre na importação — foi o que
      # aconteceu no run 31967786427 da V1.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt google-generativeai

      # Os portões rodam AQUI, não só na máquina de quem preparou. Conferir o
      # congelamento apenas local deixaria passar exatamente o caso que importa:
      # o ambiente credenciado executando artefato diferente do conferido.
      #
      # A V1 é verificada junto, e por um motivo específico: se a V2 tivesse
      # alterado a V1, o registro contra o qual a V2 será comparada estaria
      # corrompido, e a comparação não valeria nada.
      - name: Verify frozen V2 (and that V1 is untouched) before the secret
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import io, json, sys
          import reliability_occurrence_auditor_freeze as v1
          import reliability_occurrence_auditor_freeze_v2 as v2
          import reliability_occurrence_auditor_input as ai
          import reliability_occurrence_truth as ot
          D = json.load(io.open("risk_semantic_v2_shadow.json", encoding="utf-8"))
          for nome, mod in (("V1", v1), ("V2", v2)):
              div = mod.verificar_congelamento(D)
              if div:
                  print(f"CONGELAMENTO {nome} VIOLADO:", div)
                  sys.exit(1)
          fs = v2.folds(D); EX = v2.exemplos_congelados(D)
          # Um exemplo que o próprio parser recusa foi o defeito 2 da V1.
          # Nenhuma chamada acontece se ele reaparecer.
          for emp, ex in EX.items():
              p = v2.validar_saida(ex["expected_output"], ex["candidate_labels"])
              if p:
                  print(f"EXEMPLO INVALIDO ({emp}):", p)
                  sys.exit(1)
          alvos = [(f, a) for f in fs for a in f["alvos_elegiveis"]]
          ids = set(ot.ocorrencias(D))
          vaz = same = 0
          for f, a in alvos:
              p = v2.montar_prompt(f["exemplos_permitidos"], a["pacote"], EX)
              if ai.vazamentos({"prompt_payload": p["target"]}):
                  vaz += 1
              if any(i in json.dumps(p["target"], ensure_ascii=False) for i in ids):
                  vaz += 1
              if f["company"] in json.dumps(p["examples"], ensure_ascii=False):
                  same += 1
          print(f"alvos={len(alvos)} vazamento={vaz} mesma-empresa={same} "
                f"exemplos={len(EX)}")
          if len(alvos) != 17 or vaz or same or len(EX) != 3:
              sys.exit(1)
          print("congelamento V2 íntegro, V1 intacta, 17 alvos, vazamento zero")
          PY

      - name: Pre-call test gate
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          for t in test_wave_occurrence_auditor_freeze_v2.py \
                   test_wave_occurrence_auditor_freeze.py \
                   test_wave_occurrence_auditor_results.py \
                   test_wave_occurrence_auditor_input.py \
                   test_wave_occurrence_auditor_pilot.py \
                   test_wave_occurrence_truth_live.py \
                   test_wave_occurrence_truth.py \
                   test_wave_ceo_duplicate_detector.py; do
            echo "--- $t"
            python "$t" | tail -2
          done

      # A partir daqui o secret entra em cena. É passado pelo ambiente e nunca
      # impresso, medido, fatiado ou hasheado.
      - name: Run frozen 17×2 development benchmark (V2)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
          RISK_AUDITOR_PACING_S: '8'
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python reliability_occurrence_auditor_pilot_v2.py \
            --out out_auditor_pilot_v2/dev_results.jsonl \
            --manifest-out out_auditor_pilot_v2/execution_manifest.json \
            --score-out out_auditor_pilot_v2/dev_score.json

      # `always()` porque um benchmark interrompido no meio ainda produziu
      # primeiras respostas imutáveis, e perdê-las obrigaria a gastar cota de
      # novo para reproduzi-las.
      - name: Upload development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occurrence-auditor-v2-dev-results
          path: out_auditor_pilot_v2/
          if-no-files-found: warn
          retention-days: 30
