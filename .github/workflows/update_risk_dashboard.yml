name: Update Risk Dashboard

on:
  schedule:
    - cron: '0 10,13,16,19 * * 1-5'   # 07h, 10h, 13h e 16h BRT, dias úteis
    # Renovação semanal da telemetria CVM/IPE (REGULADOR_LOCAL): a auditoria
    # --audit-cvm NÃO roda nos 4 ciclos diários acima (custo/rede de baixar
    # o dataset IPE inteiro não justifica 4x/dia) — só neste cron dedicado.
    # Cadência semanal dá ~4x de margem sobre a janela de frescor de 30 dias
    # usada por coverage_diagnosis.CVM_FRESHNESS_DAYS, então uma falha
    # pontual (dataset indisponível) tem folga de sobra até a próxima
    # tentativa sem a telemetria CVM expirar.
    - cron: '0 6 * * 1'                # 03h BRT, segunda-feira — só auditoria CVM
  workflow_dispatch:
    inputs:
      reclassify:
        description: 'Reprocessar todo o histórico com as regras atuais (use após atualizar keywords/taxonomia)'
        type: boolean
        default: false
      backfill:
        description: 'Semear o histórico: busca ampliada (notícias 30d, CVM 365d, todos os tiers) — use na primeira execução'
        type: boolean
        default: false
      audit_cvm:
        description: 'Auditoria CVM/IPE: quais emissores brasileiros são filiantes (gera auditoria_cobertura_cvm.csv)'
        type: boolean
        default: false
      probe_sources:
        description: 'Probe das fontes oficiais: mede acessibilidade sem coletar (gera probe_fontes_oficiais.csv)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt google-generativeai playwright

      # Chromium p/ raspar páginas de RI 100% JavaScript (cacheado entre runs)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # necessário p/ validação LLM dos eventos
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.reclassify }}" = "true" ]; then
            EXTRA="$EXTRA --reclassify"
            echo "♻️  Modo reclassificação: reprocessando todo o histórico"
          fi
          # Backfill SÓ em dispatch manual com input=true — nunca no cron (schedule).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            EXTRA="$EXTRA --backfill"
            echo "⏪ Modo backfill: semeando o histórico com janela ampliada"
          else
            echo "⏹️  Backfill NÃO ativado (event=${{ github.event_name }}, input=${{ github.event.inputs.backfill }})"
          fi
          if [ "${{ github.event.inputs.audit_cvm }}" = "true" ]; then
            EXTRA="$EXTRA --audit-cvm"
            echo "🔎 Auditoria CVM/IPE ativada (workflow_dispatch manual)"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; then
            EXTRA="$EXTRA --audit-cvm"
            echo "🔎 Auditoria CVM/IPE ativada (cron semanal dedicado — renovação de frescor REGULADOR_LOCAL)"
          fi
          if [ "${{ github.event.inputs.probe_sources }}" = "true" ]; then
            EXTRA="$EXTRA --probe-sources"
            echo "🩺 Probe de fontes oficiais ativado (diagnóstico, não coleta)"
          fi
          # --strict-groups: aborta o deploy se algum emissor estiver sem
          # classificação cadastral (asset_class/grupo) ou sem aliases.
          echo "▶️  Comando: python risk_dashboard.py --config config_risco.yaml --strict-groups$EXTRA"
          python risk_dashboard.py --config config_risco.yaml --strict-groups $EXTRA

      - name: Prepare static output for Render
        run: cp dashboard_risco.html index.html

      # 4I.2 R5c — coleta SHADOW de contexto, só para os artigos novos deste
      # run. Roda DEPOIS do pipeline e do dashboard de propósito: o scoring já
      # foi calculado com o input original e nada daqui pode alterá-lo.
      # `continue-on-error` somado ao try/except interno garante que uma falha
      # de rede no enrichment jamais impeça a publicação — isto é
      # observabilidade, não insumo do risco. Teto de 40 requisições por run.
      - name: Shadow enrichment (prospective, no scoring impact)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python reliability_enrichment_sidecar.py --prospective
          # 4I.2 R6c — diff entre a decisão publicada e a semântica de papel
          # que ainda NÃO está ativa. Observabilidade pura: o relatório sai em
          # out_reliability/ e nada aqui alimenta score, history ou dashboard.
          python reliability_shadow_diff.py || true

      # 4I.2 R7c-P — camada de INPUT em shadow prospectivo. Roda depois do
      # dashboard pela mesma razão do passo acima: o scoring já foi calculado e
      # publicado, e nada daqui pode alterá-lo. Acumula, num sidecar PRÓPRIO
      # (`risk_input_shadow.json`, fora de todo caminho de leitura de
      # produção), o melhor texto disponível por ARTIGO — inclusive os artigos
      # atribuídos a um emissor para os quais NENHUM evento da taxonomia se
      # aplica, hoje descartados antes do history (74,7% dos atribuídos,
      # medido em dois runs independentes). Sem esse acúmulo, qualquer
      # avaliação semântica futura seguiria limitada a manchetes e ao que a
      # taxonomia já sabe nomear.
      # Teto de 40 requisições por run, UMA por artigo (nunca por empresa).
      # Não usa LLM e não exige nenhum secret novo.
      - name: Shadow input layer (prospective, no dashboard impact)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python reliability_input_shadow.py --prospective

      # Shadow prospectivo do Contract V2. Roda DEPOIS do dashboard pela mesma
      # razão dos outros shadows: o score já foi calculado e publicado, e nada
      # daqui pode alterá-lo. Valida o contrato em artigos que não existiam
      # quando ele foi escrito — os 8 controles do benchmark viraram evidência
      # de desenvolvimento e não servem mais como holdout.
      # Teto de 5 casos por ciclo, dois modelos, zero retry. `continue-on-error`
      # somado ao fail-open interno garante que cota ou provider fora do ar
      # jamais impeçam a publicação: isto é observação, não insumo de risco.
      - name: Semantic V2 shadow (prospective, no scoring impact)
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python semantic_v2_shadow_run.py

      # Histórico persistido via commit no repositório — não via actions/cache,
      # que evicta entradas não acessadas há 7 dias e tem limite de 10GB/repo.
      - name: Commit history + dashboard
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "Radar de Risco (GitHub Actions)"
          git add risk_history.json dashboard_risco.html index.html
          # 4H.1c — o runner do Actions é efêmero: sem commitar a telemetria, o
          # histórico cumulativo se perde e os 4 ciclos nunca podem ser provados.
          # international_search_history.json é OBRIGATÓRIO para a continuidade
          # (agora também carrega cvm_telemetry — telemetria CVM persistida —
          # e o campo official_sources por run, usados no frescor consolidado).
          git add -f international_search_history.json run_meta.json 2>/dev/null || true
          # 4I.2 R5c — side-car do enrichment shadow. Precisa sobreviver entre
          # runs (runner efêmero) para que a coleta continue PROSPECTIVA: sem
          # ele, todo artigo pareceria novo e o próximo run viraria backfill.
          # É dado gerado, fica FORA de risk_history.json e não alimenta score.
          git add -f risk_enrichment_shadow.json 2>/dev/null || true
          # 4I.2 R7c-P — side-car da camada de INPUT. Mesma razão do anterior:
          # o runner é efêmero e, sem persistir, todo artigo pareceria novo a
          # cada run e a coleta deixaria de ser prospectiva. É dado gerado,
          # vive FORA de risk_history.json e nenhum caminho de produção o lê.
          git add -f risk_input_shadow.json 2>/dev/null || true
          # Shadow prospectivo do Contract V2. Mesma razão dos demais
          # sidecars: o runner é efêmero e, sem persistir, a observação
          # prospectiva se perderia e o holdout nunca acumularia. Um ciclo sem
          # caso novo deixa o arquivo byte-idêntico, então isto não passa a
          # gerar commit a cada cron.
          git add -f risk_semantic_v2_shadow.json 2>/dev/null || true
          # Cache de traduções. A razão é a MESMA dos dois acima — o runner é
          # efêmero — mas a consequência é outra: sem persistir, todo cron
          # recomeça com o cache vazio e retraduz os mesmos títulos para
          # sempre, que é exatamente o desperdício que o cache existe para
          # eliminar. É dado OPERACIONAL: vive fora de risk_history.json, não é
          # evidência nem verdade humana, não alimenta score e não aparece no
          # dashboard. Um run só de acertos não altera o arquivo, então isto
          # não passa a gerar commit a cada ciclo.
          git add -f risk_translation_cache.json 2>/dev/null || true
          # Reconciliação runtime: os 6 exports de cobertura são regenerados
          # do ZERO em toda execução (risk_dashboard.main() via
          # coverage_diagnosis.run_production_coverage) e têm que entrar no
          # MESMO commit automático que o HTML — nunca um export desatualizado
          # sobrevivendo sozinho no histórico do repositório.
          git add -f out_coverage_diagnosis/ 2>/dev/null || true
          # CSVs de diagnóstico, quando gerados nesta execução
          git add -f auditoria_cobertura_cvm.csv probe_fontes_oficiais.csv \
                     auditoria_cobertura_internacional.csv \
                     cobertura_internacional_por_pais.csv 2>/dev/null || true
          # Nada mudou? sai sem erro.
          if git diff --cached --quiet; then
            echo "Nada a commitar."
            exit 0
          fi
          git commit -m "chore(radar): atualização automática $(date -u +'%Y-%m-%d %H:%M UTC')"
          # O remoto pode ter avançado enquanto o pipeline rodava (ex.: upload
          # manual de arquivos pela interface do GitHub). Sincroniza com rebase
          # antes de empurrar e tenta algumas vezes em caso de corrida.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && {
              echo "✅ push concluído na tentativa $i"; exit 0; }
            echo "⚠️  push rejeitado (remoto avançou); tentativa $i, sincronizando…"
            sleep $((i * 3))
          done
          echo "❌ não foi possível empurrar após 5 tentativas"
          exit 1
