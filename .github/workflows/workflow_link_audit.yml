name: Auditoria de links (diagnóstico, não publica)

# Verifica a saúde REAL dos links do histórico. Não altera score, não publica
# dashboard e não commita nada: apenas sobe o CSV como artifact.

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de links a verificar (0 = todos)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  link-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hash ANTES (prova de invariância)
        run: |
          mkdir -p out_links
          for f in risk_history.json index.html config_risco.yaml; do
            [ -f "$f" ] && echo "$f=$(sha256sum "$f" | cut -d' ' -f1)" >> out_links/hashes_antes.txt
          done
          cat out_links/hashes_antes.txt

      - name: Verificar links
        run: |
          python - <<'PY'
          import csv, json, os
          import link_debt_audit as lda
          import requests
          lim = int(os.environ.get("LIMITE") or "0")
          hist = json.load(open("risk_history.json", encoding="utf-8"))
          arts = hist.get("articles") or {}
          s = requests.Session()
          linhas = []
          for i, (url, rec) in enumerate(arts.items()):
              if lim and i >= lim:
                  break
              base = lda.classify_link(url)
              live = lda.check_link_live(url, session=s)
              ebc = {k: v for k, v in (rec.get("events_by_company") or {}).items() if v}
              dec = lda.link_display_decision(live.get("link_health") or base["link_health"],
                                              bool(ebc))
              linhas.append({**base, **live,
                             "titulo": (rec.get("title") or "")[:150],
                             "fonte": rec.get("source", "") or "",
                             "empresas": ";".join(ebc.keys()),
                             "corroborado": bool(ebc),
                             "exibir_botao": dec["exibir_botao"],
                             "rotulo_ui": dec["rotulo"],
                             "manter_corroboracao": dec["manter_corroboracao"]})
          os.makedirs("out_links", exist_ok=True)
          with open("out_links/auditoria_links_dashboard_live.csv", "w",
                    newline="", encoding="utf-8-sig") as f:
              w = csv.DictWriter(f, fieldnames=list(linhas[0].keys()))
              w.writeheader(); w.writerows(linhas)
          import collections
          print(collections.Counter(l["link_health"] for l in linhas))
          PY
        env:
          LIMITE: ${{ inputs.limite }}

      - name: PROVA — nada foi alterado
        run: |
          FAIL=0
          while IFS='=' read -r f old; do
            [ -z "$f" ] && continue
            new=$(sha256sum "$f" | cut -d' ' -f1)
            [ "$new" != "$old" ] && { echo "::error::$f alterado"; FAIL=1; } || echo "OK: $f"
          done < out_links/hashes_antes.txt
          git diff --exit-code -- risk_history.json index.html config_risco.yaml
          exit $FAIL

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-links-${{ github.run_id }}
          if-no-files-found: error
          path: out_links/auditoria_links_dashboard_live.csv
