name: EDGAR shadow run (4H.3B — diagnóstico, não publica)

# 4H.3B item 7/8 — execução REAL contra https://data.sec.gov em modo SHADOW.
# Usa SEMPRE --edgar-shadow-run; NUNCA uma execução normal do dashboard com o
# config candidato. Não chama Google News, CVM, RI, backfill, publicação nem
# deploy no Render. A invariância é PROVADA por hash e por `git diff --exit-code`.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execução (apenas shadow nesta fase)"
        required: true
        default: "shadow"
        type: choice
        options: ["shadow", "dry-run"]
      config:
        description: "Config candidato (NUNCA o de produção)"
        required: true
        default: "config_risco_4h3b_candidato.yaml"
        type: string

permissions:
  contents: read          # somente leitura: o job não pode commitar

jobs:
  edgar-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Definir timestamp
        id: ts
        run: echo "stamp=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Sanidade — candidato NÃO pode ligar scoring
        run: |
          python - <<'PY'
          import yaml
          c = yaml.safe_load(open("${{ inputs.config }}", encoding="utf-8"))
          assert c.get("edgar_scoring_enabled") is False, \
              "edgar_scoring_enabled DEVE ser false na 4H.3B"
          assert c.get("international_official_sources_enabled") is True
          assert (c.get("official_sources") or {}).get("EUA", {}).get("enabled") is True
          print("OK — shadow mode: fontes=true, scoring=false")
          PY

      - name: Testes (obrigatórios antes de tocar a SEC)
        run: |
          python -m py_compile risk_dashboard.py edgar_audit_4h2.py \
                 edgar_shadow_4h3a.py edgar_shadow_4h3b.py \
                 test_edgar_4h2.py test_edgar_4h3a.py test_edgar_4h3b.py
          python test_edgar_4h2.py
          python test_edgar_4h3a.py
          python test_edgar_4h3b.py
          python risk_dashboard.py --test-attribution
          python risk_dashboard.py --test-cvm-fixture
          python risk_dashboard.py --test-fund-coverage

      - name: Hashes ANTES (histórico, config, HTML, dados do Render)
        run: |
          mkdir -p out_4h3b
          : > out_4h3b/hashes_antes.txt
          for f in risk_history.json config_risco.yaml index.html \
                   run_meta.json international_search_history.json \
                   dashboard_risco.html; do
            if [ -f "$f" ]; then
              echo "$f=$(sha256sum "$f" | cut -d' ' -f1)" >> out_4h3b/hashes_antes.txt
            fi
          done
          cat out_4h3b/hashes_antes.txt

      - name: EDGAR shadow-run REAL
        if: ${{ inputs.modo == 'shadow' }}
        run: |
          python risk_dashboard.py \
            --config "${{ inputs.config }}" \
            --edgar-shadow-run \
            --run-meta run_meta.json \
            --history risk_history.json \
            --outdir out_4h3b

      - name: EDGAR dry-run REAL (sem classificação)
        if: ${{ inputs.modo == 'dry-run' }}
        run: |
          python risk_dashboard.py \
            --config "${{ inputs.config }}" \
            --edgar-dry-run \
            --run-meta run_meta.json \
            --outdir out_4h3b

      - name: Detectar placeholder AMBIENTE_SEM_ACESSO_SEC
        run: |
          F=out_4h3b/edgar_dry_run_real_por_emissor.csv
          if [ -f "$F" ] && grep -q "AMBIENTE_SEM_ACESSO_SEC" "$F"; then
            echo "::error::O runner NÃO alcançou data.sec.gov — os CSVs são PLACEHOLDERS, não dados reais."
            exit 1
          fi
          for F in out_4h3b/edgar_dry_run_real_por_emissor.csv \
                   out_4h3b/edgar_runtime_shadow_classification.csv; do
            if [ -f "$F" ]; then
              N=$(( $(wc -l < "$F") - 1 ))
              echo "$F: $N linha(s) de dados"
              if [ "$N" -lt 1 ]; then
                echo "::warning::$F sem linhas de dados"
              fi
            fi
          done

      - name: PROVA de invariância — hashes DEPOIS
        run: |
          FAIL=0
          while IFS='=' read -r f old; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then
              new=$(sha256sum "$f" | cut -d' ' -f1)
              if [ "$new" != "$old" ]; then
                echo "::error::$f FOI ALTERADO ($old -> $new)"; FAIL=1
              else
                echo "OK inalterado: $f"
              fi
            else
              echo "::error::$f DESAPARECEU"; FAIL=1
            fi
          done < out_4h3b/hashes_antes.txt
          exit $FAIL

      - name: PROVA de invariância — git diff
        run: |
          FILES=""
          for f in risk_history.json config_risco.yaml index.html dashboard_risco.html; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          if [ -n "$FILES" ]; then
            echo "Verificando git diff em:$FILES"
            git diff --exit-code -- $FILES
          else
            echo "Nenhum dos arquivos monitorados existe no repositório."
          fi
          # nada pode ter sido criado/alterado fora de out_4h3b/
          git status --porcelain | grep -v '^?? out_4h3b/' > /tmp/dirty || true
          if [ -s /tmp/dirty ]; then
            echo "::error::Arquivos alterados fora de out_4h3b/:"; cat /tmp/dirty; exit 1
          fi
          echo "OK — árvore de trabalho limpa fora de out_4h3b/"

      - name: Verificar critério de shadow no run_meta
        if: ${{ inputs.modo == 'shadow' }}
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("out_4h3b/edgar_runtime_shadow_run_meta.json")
          if not p.exists():
              print("::warning::run_meta de shadow ausente (nenhum filing coletado?)"); sys.exit(0)
          m = json.loads(p.read_text(encoding="utf-8"))
          for k, exp in [("persisted_records", 0), ("history_changed", False),
                         ("dashboard_changed", False), ("backfill", False),
                         ("scoring_enabled", False)]:
              assert m.get(k) == exp, f"{k}={m.get(k)!r}, esperado {exp!r}"
          print("OK — critério de shadow satisfeito:", json.dumps(
              {k: m.get(k) for k in ("filings_collected", "filings_classified",
                                     "filings_with_event", "simulated_score_total",
                                     "persisted_records")}, ensure_ascii=False))
          PY

      - name: Upload dos artifacts reais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgar-4h3b-${{ inputs.modo }}-${{ github.run_id }}-${{ steps.ts.outputs.stamp }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out_4h3b/edgar_runtime_shadow_classification.csv
            out_4h3b/edgar_runtime_shadow_context_events.csv
            out_4h3b/edgar_runtime_shadow_score_simulation.csv
            out_4h3b/edgar_runtime_shadow_false_positive_review.csv
            out_4h3b/edgar_runtime_shadow_deduplication.csv
            out_4h3b/edgar_runtime_shadow_run_meta.json
            out_4h3b/edgar_dry_run_real_por_emissor.csv
            out_4h3b/edgar_dry_run_real_por_estagio.csv
            out_4h3b/edgar_filings_reais.csv
            out_4h3b/edgar_shadow_classification.csv
            out_4h3b/edgar_shadow_context_events.csv
            out_4h3b/hashes_antes.txt
