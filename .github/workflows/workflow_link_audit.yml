name: Auditoria e reparo de links

# Resolve os endereços intermediários (Google News, google.com/url, encurtadores)
# que a rede corporativa recusa, e faz o botão apontar direto para a matéria.
#
#   mode=audit  → só verifica, não altera nada, sobe o CSV como artifact
#   mode=repair → resolve, persiste e reconstrói o HTML; commita SOMENTE
#                 risk_history.json e index.html
#
# Nunca altera score, eventos, ocorrências, thresholds, pesos, tiers,
# campos semânticos, config_risco.yaml nem arquivos EDGAR.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit (só verifica) ou repair (resolve e persiste)"
        required: true
        default: audit
        type: choice
        options: [audit, repair]
      verify_status:
        description: "Verificar HTTP de cada destino (mais lento)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write          # necessário só no modo repair

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Timestamp
        id: ts
        run: echo "stamp=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Testes obrigatórios antes de tocar no histórico
        run: |
          python -m py_compile risk_dashboard.py link_debt_audit.py \
                 semantic_audit.py test_links.py test_semantica.py
          python test_links.py
          python test_semantica.py
          python risk_dashboard.py --test-attribution
          python risk_dashboard.py --test-cvm-fixture
          python risk_dashboard.py --test-fund-coverage

      - name: Hashes ANTES (invariância)
        run: |
          mkdir -p out_link_repair
          : > out_link_repair/hashes_antes.txt
          for f in config_risco.yaml risk_history.json index.html \
                   semantic_audit.py template_risco.html.j2 \
                   edgar_canonical.py edgar_shadow_4h3b.py edgar_shadow_4h3c.py; do
            [ -f "$f" ] && echo "$f=$(sha256sum "$f" | cut -d' ' -f1)" >> out_link_repair/hashes_antes.txt
          done
          python - <<'PY'
          import json, hashlib
          h = json.load(open("risk_history.json", encoding="utf-8"))
          sem = {u: {"e": r.get("events_by_company"),
                     "c": r.get("context_events_by_company"),
                     "o": r.get("occurrence_id"), "t": r.get("pub_ts")}
                 for u, r in (h.get("articles") or {}).items()}
          open("out_link_repair/semantica_antes.sha", "w").write(
              hashlib.sha256(json.dumps(sem, sort_keys=True,
                                        ensure_ascii=False).encode()).hexdigest())
          print("assinatura semântica gravada")
          PY

      - name: AUDIT — verificar links sem alterar produção
        if: ${{ inputs.mode == 'audit' }}
        env:
          LINK_REPAIR_ONLINE: "1"
          LINK_REPAIR_VERIFY: ${{ inputs.verify_status && '1' || '' }}
        run: |
          python risk_dashboard.py \
            --config config_risco.yaml \
            --history risk_history.json \
            --repair-links-only \
            --output-history /tmp/history_audit.json \
            --output-html /tmp/index_audit.html \
            --audit-outdir out_link_repair

      - name: REPAIR — resolver, persistir e reconstruir o HTML
        if: ${{ inputs.mode == 'repair' }}
        env:
          LINK_REPAIR_ONLINE: "1"
          LINK_REPAIR_VERIFY: ${{ inputs.verify_status && '1' || '' }}
        run: |
          python risk_dashboard.py \
            --config config_risco.yaml \
            --history risk_history.json \
            --repair-links-only \
            --output-history risk_history.json \
            --output-html index.html \
            --audit-outdir out_link_repair
          cp index.html dashboard_risco.html

      - name: PROVA — semântica, score e configs intactos
        run: |
          FAIL=0
          while IFS='=' read -r f old; do
            [ -z "$f" ] && continue
            new=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$f" = "risk_history.json" ] || [ "$f" = "index.html" ]; then
              [ "${{ inputs.mode }}" = "repair" ] && continue
            fi
            if [ "$new" != "$old" ]; then
              echo "::error::$f foi alterado indevidamente"; FAIL=1
            else
              echo "OK inalterado: $f"
            fi
          done < out_link_repair/hashes_antes.txt
          python - <<'PY'
          import json, hashlib, sys
          h = json.load(open("risk_history.json", encoding="utf-8"))
          sem = {u: {"e": r.get("events_by_company"),
                     "c": r.get("context_events_by_company"),
                     "o": r.get("occurrence_id"), "t": r.get("pub_ts")}
                 for u, r in (h.get("articles") or {}).items()}
          novo = hashlib.sha256(json.dumps(sem, sort_keys=True,
                                           ensure_ascii=False).encode()).hexdigest()
          velho = open("out_link_repair/semantica_antes.sha").read().strip()
          assert novo == velho, "SEMÂNTICA ALTERADA — eventos/ocorrências mudaram"
          print("OK: eventos, contexto e occurrence_ids idênticos")
          PY
          if [ "${{ inputs.mode }}" = "audit" ]; then
            git diff --exit-code -- risk_history.json index.html config_risco.yaml
          else
            git diff --exit-code -- config_risco.yaml semantic_audit.py \
              template_risco.html.j2 risk_dashboard.py
          fi
          exit $FAIL

      - name: Commit (somente no modo repair, apenas arquivos autorizados)
        if: ${{ inputs.mode == 'repair' }}
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "Radar de Risco (GitHub Actions)"
          git add risk_history.json index.html dashboard_risco.html
          if git diff --cached --quiet; then
            echo "Nada a commitar."; exit 0
          fi
          git commit -m "fix(links): resolve URLs intermediárias das fontes $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep $((i * 3))
          done
          echo "::error::push falhou"; exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: links-${{ inputs.mode }}-${{ github.run_id }}-${{ steps.ts.outputs.stamp }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out_link_repair/auditoria_links_dashboard_live.csv
            out_link_repair/resumo_link_repair.json
            out_link_repair/hashes_antes.txt
